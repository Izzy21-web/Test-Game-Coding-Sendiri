<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGENT DUTY - Play on Web</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
            color: #fff;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            image-rendering: pixelated;
            max-width: 100%;
            max-height: 100%;
        }
        #status {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #ffca28;
            font-size: 16px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px 15px;
            border-radius: 5px;
        }
    </style>
    <!-- Menggunakan Pygame-Web Loader Standar -->
    <script type="py-script">import sys; sys.path.append(".")</script>
    <script src="https://pygame-web.github.io/archives/0.9/pygbag.js"></script>
</head>
<body>
    <div id="status">Memuat modul Python & Game...</div>
    <div id="canvas-container">
        <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
    </div>

    <script>
        window.addEventListener('load', async () => {
            const status = document.getElementById('status');
            
            window.App = {
                archive: null,
                filename: "AGENT-DUTY2-AMMO-REVISED.py",
                arguments: []
            };

            try {
                await pygbag.init({
                    canvas: document.getElementById('canvas'),
                    onStatus: (text) => {
                        status.innerText = text;
                        if (text.includes("Running") || text.includes("Ready") || text.includes("start")) {
                            setTimeout(() => { status.style.display = 'none'; }, 2000);
                        }
                    }
                });
                
                await pygbag.run("AGENT-DUTY2-AMMO-REVISED.py");
            } catch (err) {
                console.error(err);
                status.innerText = "Gagal memuat game: " + err.message;
            }
        });
    </script>
</body>
</html>
